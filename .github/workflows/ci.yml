name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
      OTEL_CONSOLE_EXPORT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg
      - name: Run tests
        run: pytest -q

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create test settings
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-value/' .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=mock/' .env
      - name: Start the stack and wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Check an extract request end to end
        run: |
          curl --fail --silent --show-error -F file=@samples/S02_invoice.pdf -F file2=@samples/S02_packing.pdf http://localhost:8000/v1/extract | grep -q '"status":"Match"'
          curl --fail --silent --show-error http://localhost:8501/_stcore/health
      - name: Show service state on failure
        if: failure()
        run: docker compose ps --all
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
