name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
      OTEL_CONSOLE_EXPORT: "0"
      TEST_DATABASE_URL: postgresql+psycopg://meridian:ci-only-value@localhost:5432/meridian
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_DB: meridian
          POSTGRES_PASSWORD: ci-only-value
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg
      - name: Run tests
        run: pytest -q

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create test settings
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-value/' .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=mock/' .env
          sed -i 's/^WEBHOOK_ALLOW_PRIVATE=.*/WEBHOOK_ALLOW_PRIVATE=1/' .env
          sed -i 's/^QUEUE_VISIBILITY_SECONDS=.*/QUEUE_VISIBILITY_SECONDS=45/' .env
      - name: Start the stack and wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Run database migrations in the stack
        run: docker compose exec -T api alembic upgrade head
      - name: Check the worker responds
        run: docker compose exec -T worker celery -A app.worker.celery_app inspect ping --timeout 20
      - name: Check an extract request end to end
        run: |
          curl --fail --silent --show-error -F file=@samples/S02_invoice.pdf -F file2=@samples/S02_packing.pdf http://localhost:8000/v1/extract | grep -q '"status":"Match"'
          curl --fail --silent --show-error http://localhost:8501/_stcore/health
      - name: Check Celery, Redis and row-level security, including a killed worker
        run: python3 scripts/ci_stack_check.py
      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 60 worker
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  demo-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the live demo image
        run: docker build -f deploy/demo/Dockerfile -t meridian-demo .
      - name: Refuses to start without the internal token
        run: "! docker run --rm -e PORT=7860 meridian-demo"
      - name: Start it with the mock model
        run: docker run -d --name demo -p 7860:7860 -e LLM_PROVIDER=mock -e INTERNAL_API_TOKEN=ci-only-value meridian-demo
      - name: Check the API and page through the one public port
        run: |
          for i in $(seq 1 60); do curl --fail --silent http://localhost:7860/healthz && break; sleep 3; done
          curl --fail --silent --show-error -F file=@samples/S02_invoice.pdf -F file2=@samples/S02_packing.pdf http://localhost:7860/v1/extract | grep -q '"status":"Match"'
          for i in $(seq 1 20); do curl --fail --silent http://localhost:7860/_stcore/health && break; sleep 3; done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:7860/v1/metrics)" = "401"
      - name: Show the container's log on failure
        if: failure()
        run: docker logs demo

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # Placeholder values so the app builds. They can't sign anyone in.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmljdGlvbmFsLmNsZXJrLmFjY291bnRzLmRldiQ=
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  browser:
    # Playwright 1.55 can't install its browser on ubuntu-latest, which is now 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg
      - name: Install the website and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: web
        run: npm run test:e2e
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
